# .github/workflows/ci.yml
# This workflow runs Continuous Integration (CI) including tests and linting.
# for a variety of Python versions
# For more information see:
# https://py-pkgs.org/08-ci-cd
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI - Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Runs Monday through Friday at 02:00 UTC
    - cron: '0 2 * * 1-5'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    # Ensure matplotlib uses a non-interactive backend on all runners
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.matplotlib

    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.15.0-rc.1", "3.14", "3.13", "3.12", "3.11", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    continue-on-error: ${{ startsWith(matrix.python_version, '3.15') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # Swap lockfile for Python 3.14 prior to setup-pdm
      - name: Select Python 3.14 lockfile
        if: matrix.python_version == '3.14' || startsWith(matrix.python_version, '3.15')
        shell: bash
        run: |
          if [ -f pdm.lock314 ]; then
            echo "Using pdm.lock314 for Python >= 3.14"
            cp pdm.lock314 pdm.lock
          fi

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python_version }}
          cache: true
          cache-dependency-path: |
            pyproject.toml
            pdm.lock

      - name: Install dependencies
        run: pdm install -dG test

      - name: Check formatting
        run: pdm format --check

      - name: Run Ruff linter
        run: pdm check-style

      - name: Run MyPy static analysis
        run: pdm check-types

      - name: Run test suite
        run: pdm run pytest --cov=nvector --cov-report=xml

      - name: Build package distribution
        run: pdm build

      - name: Verify wheel installation
        shell: bash
        run: |
          python -m venv test_env

          test_env/Scripts/python -m pip install --upgrade pip || \
          test_env/bin/python -m pip install --upgrade pip

          test_env/Scripts/pip install dist/*.whl || \
          test_env/bin/pip install dist/*.whl

          test_env/Scripts/python -c "import nvector; print(nvector.__version__)" || \
          test_env/bin/python -c "import nvector; print(nvector.__version__)"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python_version == '3.13' && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml